{% extends 'base.html' %}

{% block title %}403 - Access Forbidden — Job Mitra{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 4rem auto; text-align: center;">
    <div class="glass-panel" style="padding: 3rem 2rem;">
        <div style="font-size: 3.5rem; color: var(--danger); margin-bottom: 0.5rem;"><i class="fa-solid fa-hand-holding-hand"></i></div>
        <h2 style="font-size: 1.5rem; color: #fff; margin-bottom: 0.75rem;">Access Forbidden (403)</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 2rem;">
            You do not possess the required role or authorization privileges to access this console area.
        </p>
        <div style="display: flex; justify-content: center; gap: 1rem;">
            <a href="{{ url_for('jobs.index') }}" class="btn-primary"><i class="fa-solid fa-house"></i> Return to Safety</a>
        </div>
    </div>
</div>
{% endblock %}
