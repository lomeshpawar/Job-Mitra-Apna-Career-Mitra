{% extends 'base.html' %}

{% block title %}Reset Password — Job Mitra{% endblock %}

{% block content %}
<div class="container" style="max-width: 460px; margin: 4rem auto;">
    <div class="glass-panel" style="padding: 2.5rem;">
        <div style="text-align:center; margin-bottom: 2rem;">
            <div class="logo-icon" style="margin: 0 auto 1rem auto; width:52px; height:52px; font-size:1.5rem;">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 style="font-size:1.65rem; font-weight:800; color:var(--text-white);">Password Recovery</h1>
            <p style="font-size:0.875rem; color:var(--text-secondary); margin-top:4px;">
                Enter your registered email address to receive password recovery instructions.
            </p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="recoveryEmail"><i class="fa-solid fa-envelope text-primary"></i> Registered Email *</label>
                <input type="email" id="recoveryEmail" name="email" required placeholder="aditya@example.com" autocomplete="email">
            </div>

            <button type="submit" class="btn-primary" style="width:100%; margin-top:1.25rem; padding:0.75rem;">
                <i class="fa-solid fa-paper-plane"></i> Send Recovery Link
            </button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:0.84rem;">
            Remember your credentials? <a href="{{ url_for('auth.login') }}" style="color:var(--primary); font-weight:700;">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
